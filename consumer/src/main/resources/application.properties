spring.application.name=task-event-consumer
spring.main.web-application-type=none

spring.datasource.url=${AUDIT_DB_URL:jdbc:postgresql://localhost:5434/task_events_db}
spring.datasource.username=${AUDIT_DB_USER:task_events}
spring.datasource.password=${AUDIT_DB_PASSWORD:local-dev-only}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:task-consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=org.example.taskeventconsumer.kafka.dto.TaskEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=org.example.taskeventconsumer.kafka.dto
spring.kafka.listener.missing-topics-fatal=false
app.kafka.events.topic=${KAFKA_TASK_TOPIC:task-events}
