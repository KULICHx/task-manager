spring.application.name=task-manager-api
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/task_manager_db}
spring.datasource.username=${DB_USER:task_manager}
spring.datasource.password=${DB_PASSWORD:local-dev-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.cache.redis.enabled=${REDIS_CACHE_ENABLED:true}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
app.kafka.events.enabled=${KAFKA_EVENTS_ENABLED:true}
app.kafka.events.topic=${KAFKA_TASK_TOPIC:task-events}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
